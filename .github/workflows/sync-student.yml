
name: Auto Sync Student Module

on:
  repository_dispatch:
    types: [student-updated]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taskhub-student-sync
  cancel-in-progress: false

jobs:
  sync-student:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Main Repository
      - name: Checkout TaskHub Main
        uses: actions/checkout@v4
        with:
          submodules: false

      # Step 2: Get latest private Student Repository
      - name: Checkout Student Module
        uses: actions/checkout@v4
        with:
          repository: Ripon9239/taskhub-student
          ref: main
          token: ${{ secrets.STUDENT_REPO_TOKEN }}
          path: frontend/src/modules/student
          persist-credentials: false

      # Step 3: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 4: Check React Build
      - name: Install and Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Step 5: Save new Student commit reference
      - name: Commit and Push Update
        run: |
          if git diff --quiet -- frontend/src/modules/student; then
            echo "Student Module is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add frontend/src/modules/student
          git commit -m "Auto sync Student Module"
          git push origin HEAD:main
